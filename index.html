.product-desc { color: #ccc; margin-bottom: 12px; }

.footer .container { display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 40px; }
@media (max-width:700px){ .hero .container { grid-template-columns:1fr; } .product-grid { grid-template-columns:1fr; } }

let currentCategory = 'paneli';
let products = allProducts.filter(p => p.category === currentCategory);
let cart = [];
function renderProducts() {
    const grid = document.getElementById('productGrid');
    const countEl = document.getElementById('productCount');
    const catName = currentCategory === 'paneli' ? 'Paneļi' : 'Apakškonstrukcija';
    countEl.textContent = `Kopā ${products.length} produkti (${catName})`;
    grid.innerHTML = products.map(p => {
        const first = p.variants[0];
        const imgSrc = first.image ? first.image : '';
        return `
        <div class="product-card">
            <div class="product-image">
                ${imgSrc ? `<img src="${imgSrc}" alt="${p.name}" onerror="this.style.display='none';this.nextElementSibling.style.display='flex';" />` : `<span class="no-image">📷</span>`}

            <h3>${p.name}</h3>
            <div class="product-code">${p.code}</div>
            <div class="product-desc">${p.desc}</div>
            <div class="size-selector">Izmērs: <button class="size-btn">${p.sizeLabels[0]}</button></div>
            <div class="price">€${first.priceSmall.toFixed(2)} / vienība</div>
            <button class="btn btn-primary add-to-cart" data-id="${p.id}">Pievienot</button>
        </div>`;
    }).join('');
}
document.querySelectorAll('.category-tab').forEach(tab => {
    tab.addEventListener('click', function() {
        currentCategory = this.dataset.category;
        products = allProducts.filter(p => p.category === currentCategory);
        document.querySelectorAll('.category-tab').forEach(t => t.classList.remove('active'));
        this.classList.add('active');
        renderProducts();
    });
});
renderProducts();
